{% extends "base.html" %}

{% block title %}Awaiting Approval{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm">
            <div class="card-body py-5">
                <h3 class="card-title">Account Awaiting Approval</h3>
                <p class="text-muted mb-4">
                    Hello {{ current_user.name }}, your staff account has been
                    created but is still waiting for an administrator to approve
                    it. Please check back later.
                </p>
                <a class="btn btn-outline-secondary"
                   href="{{ url_for('auth.logout') }}">Logout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
